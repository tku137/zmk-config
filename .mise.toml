# ZMK local development environment configuration
# Default workflow: Anywhy Flake + Prospector dongle.
#
# Daily use:
#   mise run setup    # first install / after clean-all
#   mise run build    # build everything and copy fresh UF2s to ./artifacts
#   mise run draw     # regenerate keymap SVG

[tools]
python = "3.12"
"pipx:keymap-drawer" = "latest"

[vars]
# Zephyr 4.1.0 expects Zephyr SDK 0.17.0.
sdk_version = "0.17.0"

[env]
# Use the project venv, not mise's Python shims.
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

ZEPHYR_SDK_INSTALL_DIR = "{{env.HOME}}/zephyr-sdk-{{vars.sdk_version}}"
ZMK_CONFIG = "{{config_root}}/config"

# ---------------------------------------------------------------------------
# Public tasks
# ---------------------------------------------------------------------------

[tasks.setup]
alias = ["setup-all"]
description = "Install/update west, Zephyr/ZMK deps, Python deps, and Zephyr SDK"
depends = ["_host-check", "_install-zephyr-sdk", "_install-python-deps"]
run = '''
echo "✅ ZMK development environment setup complete."
echo ""
echo "Useful commands:"
echo "  mise run build   # build dongle setup and collect UF2s"
echo "  mise run draw    # redraw keymap SVG"
echo "  mise run doctor  # sanity-check environment"
'''

[tasks.build]
alias = ["dongle", "release", "all"]
description = "Build Prospector dongle setup and collect fresh UF2 artifacts"
depends = ["_build-all", "_artifacts"]
run = '''
echo "✅ All firmware built successfully."
echo "Artifacts ready in ./artifacts/"
echo ""
echo "Flash order:"
echo "1. Reset: flash reset-flake.uf2 to left & right, reset-dongle.uf2 to dongle"
echo "2. Firmware: flash flake-left.uf2 to left, flake-right.uf2 to right, flake-dongle.uf2 to dongle"
echo "3. Pair: power on dongle → left → right"
'''

[tasks.draw]
alias = ["draw-keymap"]
description = "Draw SVG from the ZMK keymap"
depends = ["_parse-keymap"]
run = '''
keymap -c keymap-drawer/keymap_drawer.config.yaml draw \
  keymap-drawer/anywhy_flake.local.yaml \
  --qmk-info-json flake-zmk-module/anywhy_flake.json \
  > keymap-drawer/anywhy_flake.local.svg

echo "✅ Wrote keymap-drawer/anywhy_flake.local.svg"
'''

[tasks.update]
description = "Update west modules and Python requirements"
depends = ["_west-update", "_west-export"]
run = [
    "test -f zephyr/scripts/requirements-base.txt && python -m pip install -r zephyr/scripts/requirements-base.txt || true",
    "test -f zephyr/scripts/requirements-extras.txt && python -m pip install -r zephyr/scripts/requirements-extras.txt || true",
    "python -m pip install protobuf grpcio-tools",
]

[tasks.doctor]
description = "Quick environment sanity check"
run = '''
echo "west:" $(west --version 2>/dev/null || echo "not found")
echo "cmake:" $(cmake --version 2>/dev/null | head -n1 || echo "not found")
echo "ninja:" $(ninja --version 2>/dev/null || echo "not found")
echo "dtc:" $(dtc --version 2>/dev/null | head -n1 || echo "not found")
echo "python:" $(python --version 2>/dev/null || echo "not found")
echo "ZEPHYR_SDK_INSTALL_DIR=$ZEPHYR_SDK_INSTALL_DIR"

if [ -x "$ZEPHYR_SDK_INSTALL_DIR/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" ]; then
  echo "SDK compiler:" $("$ZEPHYR_SDK_INSTALL_DIR/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" --version | head -n1)
  file "$ZEPHYR_SDK_INSTALL_DIR/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc" || true
elif [ -d "$ZEPHYR_SDK_INSTALL_DIR" ]; then
  echo "SDK status: directory exists, but compiler was not found"
else
  echo "SDK status: not found"
fi
'''

[tasks.clean]
description = "Clean build outputs and artifacts"
run = "rm -rf build artifacts"

[tasks.clean-all]
description = "Clean build outputs, artifacts, venv, west workspace, and checked-out modules"
confirm = { message = "This deletes build/, artifacts/, .venv/, .west/, zephyr/, zmk/, and modules. Continue?", default = "no" }
run = [
    "rm -rf build artifacts",
    "rm -rf .west .venv",
    "rm -rf zephyr zmk modules flake-zmk-module prospector-zmk-module",
    "echo 'All clean. Run: mise run setup'",
]

# ---------------------------------------------------------------------------
# Hidden setup internals
# ---------------------------------------------------------------------------

[tasks._host-check]
hide = true
description = "Fail if key host tools are missing"
run = '''
missing=""
for c in cmake ninja dtc gperf tar protoc; do
  if ! command -v "$c" >/dev/null 2>&1; then
    missing="$missing $c"
  fi
done

if [ -n "$missing" ]; then
  missing="${missing# }"
  printf "missing tool(s): %s\n" "$missing" >&2
  exit 1
fi
'''

[tasks._install-west]
hide = true
description = "Install west into the project venv"
depends = ["_host-check"]
run = [
    "python -c 'import pip' 2>/dev/null || python -m ensurepip --upgrade",
    "python -m pip -q install -U pip wheel",
    "python -m pip -q install west",
]

[tasks._west-init]
hide = true
description = "Initialize west workspace"
depends = ["_install-west"]
run = ["[ -f '.west/config' ] || west init -l config"]

[tasks._west-update]
hide = true
description = "Update west dependencies"
depends = ["_west-init"]
run = ["west update"]

[tasks._west-export]
hide = true
description = "Export Zephyr CMake package"
depends = ["_west-update"]
run = ["west zephyr-export"]

[tasks._install-python-deps]
hide = true
description = "Install Python dependencies for Zephyr/ZMK"
depends = ["_west-update"]
run = [
    "python -m pip install -r zephyr/scripts/requirements-base.txt",
    "python -m pip install -r zephyr/scripts/requirements-extras.txt",
    "python -m pip install protobuf grpcio-tools",
]

[tasks._install-zephyr-sdk]
hide = true
description = "Install Zephyr SDK"
depends = ["_west-export"]
run = '''
SDK_DIR="${ZEPHYR_SDK_INSTALL_DIR}"

if [ -d "${SDK_DIR}" ] && [ -x "${SDK_DIR}/setup.sh" ]; then
    echo "SDK already present at ${SDK_DIR}"
    exit 0
fi

echo "Installing Zephyr SDK {{vars.sdk_version}} to ${SDK_DIR}..."
west sdk install \
  --version "{{vars.sdk_version}}" \
  --install-dir "${SDK_DIR}"
'''

# ---------------------------------------------------------------------------
# Hidden build internals
# ---------------------------------------------------------------------------

[tasks._build-left]
hide = true
description = "Build left half as peripheral"
run = '''
west build \
  -p -d build/flake-left \
  -s zmk/app -b "nice_nano//zmk" \
  -- -DSHIELD=anywhy_flake_left \
     -DZMK_CONFIG="$ZMK_CONFIG"
'''

[tasks._build-right]
hide = true
description = "Build right half as peripheral"
run = '''
west build \
  -p -d build/flake-right \
  -s zmk/app -b "nice_nano//zmk" \
  -- -DSHIELD=anywhy_flake_right \
     -DZMK_CONFIG="$ZMK_CONFIG"
'''

[tasks._build-dongle]
hide = true
description = "Build Prospector dongle central with ZMK Studio"
run = '''
west build \
  -p -d build/flake-dongle \
  -s zmk/app -b "xiao_ble//zmk" \
  -S studio-rpc-usb-uart \
  -- -DSHIELD="anywhy_flake_dongle prospector_adapter" \
     -DZMK_CONFIG="$ZMK_CONFIG" \
     -DCONFIG_ZMK_STUDIO=y
'''

[tasks._build-reset-flake]
hide = true
description = "Build settings reset for keyboard halves"
run = '''
west build \
  -p -d build/reset-flake \
  -s zmk/app -b "nice_nano//zmk" \
  -- -DSHIELD=settings_reset \
     -DZMK_CONFIG="$ZMK_CONFIG"
'''

[tasks._build-reset-dongle]
hide = true
description = "Build settings reset for dongle"
run = '''
west build \
  -p -d build/reset-dongle \
  -s zmk/app -b "xiao_ble//zmk" \
  -- -DSHIELD=settings_reset \
     -DZMK_CONFIG="$ZMK_CONFIG"
'''

[tasks._build-all]
hide = true
description = "Build all firmware for Prospector dongle setup"
depends = [
    "_build-left",
    "_build-right",
    "_build-dongle",
    "_build-reset-flake",
    "_build-reset-dongle",
]

[tasks._artifacts]
hide = true
description = "Collect fresh UF2s for dongle setup"
wait_for = ["_build-all"]
run = '''
rm -rf artifacts
mkdir -p artifacts

copied=0
for p in build/flake-left build/flake-right build/flake-dongle build/reset-flake build/reset-dongle; do
  uf2="$p/zephyr/zmk.uf2"
  [ -f "$uf2" ] || uf2="$p/zephyr/zephyr.uf2"

  if [ -f "$uf2" ]; then
    cp "$uf2" "artifacts/$(basename "$p").uf2" || { echo "copy failed for $p"; exit 1; }
    copied=$((copied+1))
  else
    echo "missing UF2 for $p" >&2
  fi
done

ls -lh artifacts
[ "$copied" -eq 5 ] || { echo "Expected 5 UF2s, copied $copied" >&2; exit 1; }
'''

# ---------------------------------------------------------------------------
# Hidden keymap drawing internals
# ---------------------------------------------------------------------------

[tasks._parse-keymap]
hide = true
description = "Parse ZMK .keymap into local YAML for keymap-drawer, preserving manual tweaks"
run = '''
base="keymap-drawer/anywhy_flake.base.yaml"
out="keymap-drawer/anywhy_flake.local.yaml"
tmp="$(mktemp)"

if [ -f "$base" ]; then
  keymap -c keymap-drawer/keymap_drawer.config.yaml parse \
    -b "$base" \
    -c 10 \
    -z config/anywhy_flake.keymap \
    > "$tmp"
else
  keymap -c keymap-drawer/keymap_drawer.config.yaml parse \
    -c 10 \
    -z config/anywhy_flake.keymap \
    > "$tmp"
fi

mv "$tmp" "$out"
'''
